9. LỘ TRÌNH TRIỂN KHAI: Giai đoạn 1 (Tiền khả thi) -> Giai đoạn 2 (Khả thi & F/S) -> Giai đoạn 3 (Lựa chọn nhà đầu tư) -> Giai đoạn 4 (Thi công & vận hành).

            summary: '📌 **Tóm tắt Tổ 1:**\n• Chiều dài toàn tuyến: 182,1 km (169,3 km đường đất, 12 km hầm, 0,8 km cầu)\n• Tổng mức đầu tư sơ bộ: 42.011,48 tỷ đồng (~42,01 nghìn tỷ)\n• Tiết kiệm vận tải: 114,95 tỷ đồng/năm (vòng đời 30 năm)',

        {

            text: `BÁO CÁO TÓM TẮT DỰ ÁN MÔ HÌNH GIAO THÔNG CT01: Tuyến vận tải từ Nhà máy Alumin Nhân Cơ đến Cảng Quốc tế Cam Ranh.

3. THÔNG SỐ KỸ THUẬT VÀ CHI PHÍ ĐẦU TƯ:

GIỚI THIỆU MÔ HÌNH LIÊN KẾT NHÂN CƠ – CAM RANH: Gồm 3 địa điểm chính: Nhà máy Alumin Nhân Cơ (xuất phát), Trạm Logistics trung chuyển (trung gian điều phối) và Cảng Cam Ranh (đầu mối cảng biển). Ứng dụng đạo hàm trong Toán học để xác định vị trí trạm trung chuyển tối ưu.

    document.getElementById('fileInput').addEventListener('change', async function(event) {
        const files = event.target.files;

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            appendMessage('user', `📁 Đang phân tích tệp: ${file.name}`);
            
            try {
                let rawText = "";
                const nameLower = file.name.toLowerCase();

                if (nameLower.endsWith('.docx')) {
                    rawText = await new Promise((res, rej) => {
                        const r = new FileReader();
                        r.onload = e => mammoth.extractRawText({ arrayBuffer: e.target.result }).then(rObj => res(rObj.value || "")).catch(rej);
                        r.readAsArrayBuffer(file);
                    });
                } else if (nameLower.endsWith('.pdf')) {
                    rawText = await new Promise((res, rej) => {
                        const r = new FileReader();
                        r.onload = async e => {
                            try {
                                const pdf = await pdfjsLib.getDocument(new Uint8Array(e.target.result)).promise;
                                let t = "";
                                for(let pIdx = 1; pIdx <= Math.min(pdf.numPages, 15); pIdx++){
                                    const p = await pdf.getPage(pIdx);
                                    const txt = await p.getTextContent();
                                    t += txt.items.map(item => item.str).join(" ") + "\n";
                                }
                                res(t);
                            } catch(err) { rej(err); }
                        };
                        r.readAsArrayBuffer(file);
                    });
                }

                if (rawText) {
                    const newPlanId = 'file-' + Date.now() + '-' + i;
                    const planName = `📄 ${file.name}`;
                    const summary = `📌 **Tóm tắt tệp tải lên:**\n• Tên tệp: ${file.name}\n• Đã nạp và xử lý dữ liệu thành công.`;

                    const newPlan = { id: newPlanId, name: planName, text: rawText, summary: summary, image: null };
                    userUploadedPlans.push(newPlan);
                }
            } catch (err) {
                console.error(err);
            }
        }

                        <th>Vị trí Trạm D mới</th>
                        <th>Tổng vốn đầu tư mới (tỷ)</th>
                        <th>Mức giá tăng thêm (tỷ)</th>
                    </tr>
                    <tr><td>Ban đầu</td><td>DC = 59,5 km</td><td>44.550</td><td>0 (Tiết kiệm 1.562 tỷ)</td></tr>
                    <tr><td>Dời 2,5 km</td><td>DC = 57 km</td><td>44.552,5</td><td>+2,5</td></tr>
                    <tr><td>Dời 5 km</td><td>DC = 54,5 km</td><td>44.565</td><td>+15</td></tr>
                    <tr><td>Dời 10 km</td><td>DC = 49,5 km</td><td>44.605</td><td>+55</td></tr>
                </table>
            `;
            appendHtmlTableMessage(tableHtml);
        } else {
            appendMessage('bot', `📊 **SỐ LIỆU TỪ TỆP TẢI LÊN (${plan.name}):**\n\n• Tệp đã được phân tích dữ liệu tự động.`);
        }
    }

    function answerProjectModel() {
        const plan = allPlans.find(p => p.id === activePlanId);
        if (plan && plan.image) {
            appendMessage('bot', `🖼️ **MÔ HÌNH DỰ ÁN:**`, plan.image);
            return;
        }
        appendMessage('bot', `🖼️ **Sơ đồ cấu trúc bài toán logistics và định vị dự án:**`, "https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=600&q=80");
    }

    function sendQueryModel() {
        answerProjectModel();
    }

    function clearUserData() {
        localStorage.removeItem("nhom4_separated_files_v30");
        userUploadedPlans = [];
        loadPlans();
        appendMessage('bot', '🗑️ Đã xóa sạch dữ liệu tệp tải lên cá nhân.');
    }

    function sendQuickQuery(text) {
        document.getElementById('userInput').value = text;
        sendMessage();
    }

    function sendMessage() {
        const input = document.getElementById('userInput');
        if(!input) return;
        const q = input.value.trim();
        if (!q) return;
        appendMessage('user', q);
        input.value = "";
        setTimeout(() => processQuery(q), 30);
    }

    function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
    function escapeHtml(text) { return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    function appendMessage(sender, text, img = null) {
        const box = document.getElementById('chatBox');
        if (!box) return;
        
        const div = document.createElement('div');
        div.className = `message ${sender === 'user' ? 'user-message' : 'bot-message'}`;
        let html = escapeHtml(text).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
        if (img) html += `<br><img src="${img}" class="chat-img" alt="Hình ảnh">`;
        div.innerHTML = html;
        box.appendChild(div);
        
        setTimeout(() => { box.scrollTop = box.scrollHeight; }, 50);
    }

    function appendHtmlTableMessage(tableHtml) {
        const box = document.getElementById('chatBox');
        if (!box) return;
        const div = document.createElement('div');
        div.className = 'message bot-message';
        div.innerHTML = tableHtml;
        box.appendChild(div);
        
        setTimeout(() => { box.scrollTop = box.scrollHeight; }, 50);
    }

    function processQuery(q) {
        const qLower = q.toLowerCase();
        if (qLower.includes("toàn bộ nội dung")) { answerFullDocument(); return; }
        if (qLower.includes("lợi ích") || qLower.includes("mục 5") || qLower.includes("thuận lợi")) { answerAllBenefits(); return; }
        if (qLower.includes("thách thức") || qLower.includes("hạn chế") || qLower.includes("mục 8")) { answerRisks(); return; }
        if (qLower.includes("số liệu") || qLower.includes("bảng")) { answerSummaryData(); return; }
        if (qLower.includes("mô hình")) { answerProjectModel(); return; }

        const plan = allPlans.find(p => p.id === activePlanId);
        if (plan && plan.text) {
            let sentences = plan.text.split(/(?<=[.?!])\s+/);
            const matches = sentences.filter(s => s.toLowerCase().includes(qLower));
            if (matches.length > 0) {
                appendMessage('bot', `🔍 **Kết quả tìm kiếm cho "${q}" trong (${plan.name}):**\n\n• ` + matches.slice(0, 5).join("\n\n• "));
                return;
            }
        }
        appendMessage('bot', `Tui chưa tìm thấy thông tin phù hợp cho từ khóa này.`);
    }
</script>
