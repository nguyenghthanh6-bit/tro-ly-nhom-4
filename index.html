        answerProjectModel();
    }

    function clearUserData() {
        localStorage.removeItem("nhom4_separated_files_v60");
        userUploadedPlans = [];
        loadPlans();
        appendMessage('bot', '🗑️ Đã xóa sạch dữ liệu tệp tải lên cá nhân.');
    }

    function sendQuickQuery(text) {
        document.getElementById('userInput').value = text;
        sendMessage();
    }

    function sendMessage() {
        const input = document.getElementById('userInput');
        if(!input) return;
        const q = input.value.trim();
        if (!q) return;
        appendMessage('user', q);
        input.value = "";
        setTimeout(() => processQuery(q), 30);
    }

    function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
    function escapeHtml(text) { return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    function appendMessage(sender, text, img = null) {
        const box = document.getElementById('chatBox');
        if (!box) return;
        
        const div = document.createElement('div');
        div.className = `message ${sender === 'user' ? 'user-message' : 'bot-message'}`;
        let html = escapeHtml(text).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
        if (img) html += `<br><img src="${img}" class="chat-img" alt="Hình ảnh mô hình">`;
        div.innerHTML = html;
        box.appendChild(div);
        
        setTimeout(() => { box.scrollTop = box.scrollHeight; }, 50);
    }

    function appendHtmlTableMessage(tableHtml) {
        const box = document.getElementById('chatBox');
        if (!box) return;
        const div = document.createElement('div');
        div.className = 'message bot-message';
        div.innerHTML = tableHtml;
        box.appendChild(div);
        
        setTimeout(() => { box.scrollTop = box.scrollHeight; }, 50);
    }

    function processQuery(q) {
        const qLower = q.toLowerCase();
        if (qLower.includes("toàn bộ nội dung")) { answerFullDocument(); return; }
        if (qLower.includes("lợi ích")) { answerCoreBenefitsTable(); return; }
        if (qLower.includes("thách thức") || qLower.includes("tài chính") || qLower.includes("hạn chế")) { answerRisks(); return; }
        if (qLower.includes("bảng mô phỏng geogebra") || qLower.includes("geogebra")) { answerGeogebraSimulationTable(); return; }
        if (qLower.includes("tóm tắt số liệu") || qLower.includes("dự toán") || qLower.includes("lcc") || qLower.includes("số liệu và bảng")) { answerSummaryData(); return; }
        if (qLower.includes("mô hình")) { answerProjectModel(); return; }

        const plan = allPlans.find(p => p.id === activePlanId);
        if (plan && plan.text) {
            let sentences = plan.text.split(/(?<=[.?!])\s+/);
            const matches = sentences.filter(s => s.toLowerCase().includes(qLower));
            if (matches.length > 0) {
                appendMessage('bot', `🔍 **Kết quả tìm kiếm cho "${q}" trong (${plan.name}):**\n\n• ` + matches.slice(0, 5).join("\n\n• "));
                return;
            }
        }
        appendMessage('bot', `Tui chưa tìm thấy thông tin phù hợp cho từ khóa này.`);
    }
</script>
