<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRỢ LÝ NHÓM 4 - FPT AI DASHBOARD</title>
    <!-- Thư viện đọc file Word (.docx) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
    <!-- Thư viện đọc file PDF (.pdf) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0b1329; color: #e2e8f0; height: 100vh; display: flex; overflow: hidden; }

        /* SIDEBAR BÊN TRÁI */
        .sidebar { width: 320px; background: #0f172a; border-right: 1px solid #1e293b; display: flex; flex-direction: column; padding: 20px; gap: 20px; flex-shrink: 0; }
        .brand { display: flex; align-items: center; gap: 12px; padding-bottom: 15px; border-bottom: 1px solid #1e293b; }
        .brand-avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #38bdf8; object-fit: cover; }
        .brand-info h2 { font-size: 15px; color: #38bdf8; letter-spacing: 0.5px; text-transform: uppercase; }
        .brand-info p { font-size: 11px; color: #94a3b8; }
        .sidebar-section { display: flex; flex-direction: column; gap: 10px; }
        .sidebar-title { font-size: 12px; color: #64748b; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .action-btn { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; padding: 10px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: all 0.2s; text-align: left; width: 100%; }
        .action-btn:hover { background: #0284c7; border-color: #38bdf8; color: #fff; }
        .action-btn.upload-btn { background: #064e3b; border-color: #059669; color: #34d399; font-weight: bold; }
        .action-btn.upload-btn:hover { background: #047857; }
        .action-btn.clear-btn { background: #451a1a; border-color: #7f1d1d; color: #fca5a5; }
        .action-btn.clear-btn:hover { background: #991b1b; color: #fff; }

        #fileInput, #planImageInput { display: none; }
        .plans-container { display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; }
        .plan-item { background: #1e293b; border: 1px solid #334155; padding: 10px 12px; border-radius: 6px; font-size: 12.5px; color: #94a3b8; cursor: pointer; transition: all 0.2s; }
        .plan-item:hover, .plan-item.active { background: #0284c7; color: #fff; border-color: #38bdf8; font-weight: bold; }

        /* KHUNG CHÍNH BÊN PHẢI */
        .main-content { flex: 1; display: flex; flex-direction: column; background: #0b1329; }
        .top-header { background: #0f172a; padding: 15px 25px; border-bottom: 1px solid #1e293b; display: flex; align-items: center; justify-content: space-between; }
        .top-header h1 { font-size: 18px; color: #f8fafc; }

        .quick-queries { display: flex; gap: 10px; padding: 12px 25px; background: #0f172a; border-bottom: 1px solid #1e293b; overflow-x: auto; }
        .query-chip { background: #1e293b; border: 1px solid #334155; color: #38bdf8; padding: 8px 16px; border-radius: 20px; font-size: 12.5px; cursor: pointer; white-space: nowrap; transition: all 0.2s; font-weight: 600; }
        .query-chip:hover { background: #38bdf8; color: #0f172a; }
        .query-chip.ai-ask { background: #4c1d95; border-color: #7c3aed; color: #e9d5ff; }
        .query-chip.ai-ask:hover { background: #7c3aed; color: #fff; }
        .query-chip.risk-btn { background: #7f1d1d; border-color: #dc2626; color: #fca5a5; }
        .query-chip.risk-btn:hover { background: #dc2626; color: #fff; }
        .query-chip.benefit-btn { background: #064e3b; border-color: #059669; color: #34d399; }
        .query-chip.benefit-btn:hover { background: #059669; color: #fff; }

        .chat-box { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .message { max-width: 80%; padding: 14px 18px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .user-message { background: #0284c7; color: #ffffff; align-self: flex-end; border-bottom-right-radius: 2px; }
        .bot-message { background: #1e293b; color: #f1f5f9; align-self: flex-start; border-bottom-left-radius: 2px; border: 1px solid #334155; }
        .bot-message strong { color: #38bdf8; }
        .chat-img { max-width: 450px; border-radius: 8px; margin-top: 10px; border: 1px solid #475569; display: block; }

        .chat-input-area { padding: 20px 25px; background: #0f172a; border-top: 1px solid #1e293b; display: flex; gap: 12px; }
        .chat-input-area input { flex: 1; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 14px 20px; border-radius: 30px; outline: none; font-size: 14px; }
        .chat-input-area input:focus { border-color: #38bdf8; }
        .chat-input-area button { background: #0284c7; color: white; border: none; padding: 12px 28px; border-radius: 30px; font-size: 14px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .chat-input-area button:hover { background: #0369a1; }

        /* --- TÍCH HỢP RESPONSIVE HOÀN HẢO CHO ĐIỆN THOẠI --- */
        @media (max-width: 768px) {
            body {
                flex-direction: column; /* Xếp dọc màn hình trên điện thoại */
                height: 100vh;
                overflow: hidden;
            }

            .sidebar {
                width: 100%;
                max-height: 160px; /* Thu gọn sidebar phía trên để nhường chỗ cho khung chat */
                padding: 10px;
                gap: 8px;
            }

            .brand-info h2 { font-size: 13px; }
            .brand-info p { display: none; } /* Ẩn bớt mô tả nhỏ trên màn hình đt cho gọn */
            
            .plans-container {
                max-height: 45px; /* Thu gọn danh sách phương án */
            }

            .main-content {
                height: calc(100vh - 160px);
            }

            .top-header {
                padding: 10px 15px;
            }
            .top-header h1 {
                font-size: 14px;
            }

            .quick-queries {
                padding: 8px 12px;
            }

            .chat-box {
                padding: 15px;
            }

            .message {
                max-width: 90%;
                font-size: 13px;
                padding: 10px 14px;
            }

            .chat-input-area {
                padding: 12px 15px;
            }

            .chat-input-area input {
                padding: 10px 16px;
                font-size: 13px;
            }

            .chat-input-area button {
                padding: 10px 18px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="brand">
            <img src="miku.jpg" alt="Avatar" class="brand-avatar" onerror="this.src='https://via.placeholder.com/45'">
            <div class="brand-info">
                <h2>TRỢ LÝ NHÓM 4</h2>
                <p>Hệ thống AI Dashboard</p>
            </div>
        </div>

        <div class="sidebar-section">
            <span class="sidebar-title">Quản lý Tài liệu</span>
            <label for="fileInput" class="action-btn upload-btn">📁 Nạp Tệp Word/PDF</label>
            <input type="file" id="fileInput" accept=".docx,.pdf,.jpg,.png,.jpeg">

            <label for="planImageInput" class="action-btn">🖼️ Gắn Ảnh Mô Hình</label>
            <input type="file" id="planImageInput" accept=".jpg,.png,.jpeg" onchange="attachImageToActivePlan(event)">
        </div>

        <div class="sidebar-section">
            <span class="sidebar-title">Danh sách Phương án</span>
            <div class="plans-container" id="dynamicPlansList"></div>
        </div>

        <div class="sidebar-section" style="margin-top: auto;">
            <button class="action-btn clear-btn" onclick="clearAllData()">🗑️ Xóa Dữ Liệu Lưu</button>
        </div>
    </div>

    <div class="main-content">
        <div class="top-header">
            <h1>BẢNG ĐIỀU KHIỂN PHÂN TÍCH DỰ ÁN</h1>
            <span style="font-size: 12px; color: #34d399; background: #064e3b; padding: 4px 12px; border-radius: 12px; font-weight: bold;">● Mobile & PC Ready</span>
        </div>

        <div class="quick-queries">
            <button class="query-chip ai-ask" onclick="generateDynamicQuestions()">🤖 AI Đặt Câu Hỏi</button>
            <button class="query-chip benefit-btn" onclick="sendQuickQuery('Tổng hợp tất cả lợi ích dự án')">📈 Lợi Ích Tổng Hợp</button>
            <button class="query-chip risk-btn" onclick="sendQuickQuery('Phân tích rủi ro và nguy cơ')">⚠️ Rủi Ro & Nguy Cơ</button>
            <button class="query-chip" onclick="sendQuickQuery('Tổng chi phí cho dự án')">🧮 Tính Chi Phí</button>
            <button class="query-chip" onclick="sendQuickQuery('Mô hình dự án')">🖼️ Mô hình</button>
            <button class="query-chip" onclick="sendQuickQuery('Tác động đến doanh thu')">💰 Doanh Thu</button>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot-message">👋 Tui là trợ lý Nhóm 4! Giao diện đã được tối ưu hoàn hảo cho cả máy tính lẫn điện thoại. Hãy nạp file và trải nghiệm ngay nhé!</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Nhập câu hỏi hoặc yêu cầu..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Gửi</button>
        </div>
    </div>

<script>
    if (window.pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.worker.min.js';
    }

    const projectImages = [
        {
            keywords: ["mô hình dự án", "mô hình", "sơ đồ", "bản đồ"],
            title: "Mô hình & Sơ đồ cấu trúc dự án",
            url: "https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=600&q=80"
        }
    ];

    let savedPlans = [];
    let activePlanId = null;

    window.onload = function() {
        try {
            const storedPlans = localStorage.getItem("nhom4_saved_plans");
            if (storedPlans) {
                savedPlans = JSON.parse(storedPlans);
                if (savedPlans.length > 0) {
                    activePlanId = savedPlans[0].id;
                    renderPlanChips();
                    appendMessage('bot', `💾 Đã khôi phục ${savedPlans.length} Phương án từ bộ nhớ.`);
                }
            }
        } catch(e) { localStorage.removeItem("nhom4_saved_plans"); }
    };

    document.getElementById('fileInput').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        appendMessage('user', `📁 Chọn tệp: ${file.name}`);
        appendMessage('bot', `⏳ Đang đọc dữ liệu chi tiết từ "${file.name}"...`);

        setTimeout(async () => {
            try {
                let extractedText = "";
                let imageUrl = null;
                const nameLower = file.name.toLowerCase();

                if (nameLower.endsWith('.jpg') || nameLower.endsWith('.png') || nameLower.endsWith('.jpeg')) {
                    imageUrl = URL.createObjectURL(file);
                    extractedText = `[HÌNH ẢNH MÔ HÌNH: ${file.name}]\nPhân tích ảnh: Tài liệu hình ảnh sơ đồ mô hình và cấu trúc dự án.`;
                } 
                else if (nameLower.endsWith('.docx')) { 
                    extractedText = await readDocxFileWithTables(file); 
                } 
                else if (nameLower.endsWith('.pdf')) { 
                    extractedText = await readPdfFile(file); 
                } 
                else {
                    appendMessage('bot', '⚠️ Chỉ hỗ trợ file Word (.docx), PDF (.pdf) hoặc Hình ảnh (.jpg, .png).');
                    return;
                }

                if (extractedText.length > 80000) extractedText = extractedText.substring(0, 80000);

                const newPlanId = Date.now();
                const planName = `Phương án ${savedPlans.length + 1} (${file.name})`;
                const summary = generateDetailedSummary(extractedText);

                const newPlan = {
                    id: newPlanId,
                    fileName: file.name,
                    name: planName,
                    text: extractedText,
                    summary: summary,
                    image: imageUrl
                };

                savedPlans.push(newPlan);
                activePlanId = newPlanId;
                savePlansToStorage();
                renderPlanChips();

                appendMessage('bot', `✅ **ĐÃ NẠP THÀNH CÔNG ${planName.toUpperCase()}**\n\n📌 **TÓM TẮT TOÀN BỘ NỘI DUNG CHI TIẾT:**\n${summary}`, imageUrl);
            } catch (error) {
                console.error(error);
                appendMessage('bot', `❌ Lỗi khi đọc file "${file.name}". Vui lòng kiểm tra lại tệp.`);
            }
        }, 100);
    });

    function attachImageToActivePlan(event) {
        const file = event.target.files[0];
        if (!file) return;

        const plan = savedPlans.find(p => p.id === activePlanId);
        if (!plan) {
            appendMessage('bot', '⚠️ Vui lòng chọn một Phương án bên danh sách trái trước khi thêm ảnh!');
            return;
        }

        const imageUrl = URL.createObjectURL(file);
        plan.image = imageUrl;
        savePlansToStorage();

        appendMessage('bot', `🖼️ Đã cập nhật thành công hình ảnh mô hình cho **${plan.name}**!`, imageUrl);
        event.target.value = "";
    }

    function renderPlanChips() {
        const container = document.getElementById('dynamicPlansList');
        container.innerHTML = "";
        savedPlans.forEach(plan => {
            const div = document.createElement('div');
            div.className = `plan-item ${plan.id === activePlanId ? 'active' : ''}`;
            div.innerText = `📄 ${plan.name}`;
            div.onclick = () => selectPlan(plan.id);
            container.appendChild(div);
        });
    }

    function selectPlan(id) {
        activePlanId = id;
        renderPlanChips();
        const plan = savedPlans.find(p => p.id === id);
        if (plan) {
            appendMessage('bot', `🔄 **ĐÃ CHUYỂN SANG: ${plan.name.toUpperCase()}**\n\n📌 **TÓM TẮT TOÀN BỘ NỘI DUNG CHI TIẾT:**\n${plan.summary}`, plan.image);
        }
    }

    function answerAllBenefits() {
        const plan = savedPlans.find(p => p.id === activePlanId);
        if (!plan || !plan.text) {
            appendMessage('bot', '⚠️ Vui lòng nạp hoặc chọn tài liệu trước.');
            return;
        }
        const benefitKeywords = ["lợi ích", "doanh thu", "hiệu quả", "tăng trưởng", "lợi nhuận", "giúp ích", "giá trị", "môi trường", "sinh thái", "thiên nhiên", "cây xanh", "an sinh", "xã hội", "cộng đồng", "người dân", "việc làm", "hộ dân", "phát triển"];
        searchAndRespond(plan, benefitKeywords, "📈 **TỔNG HỢP LỢI ÍCH DỰ ÁN (Kinh tế - Môi trường - Xã hội):**");
    }

    function answerRisks() {
        const plan = savedPlans.find(p => p.id === activePlanId);
        if (!plan || !plan.text) {
            appendMessage('bot', '⚠️ Vui lòng nạp hoặc chọn tài liệu trước.');
            return;
        }
        const riskKeywords = ["rủi ro", "nguy cơ", "thách thức", "khó khăn", "hạn chế", "tác động xấu", "ảnh hưởng", "biến động", "lo ngại", "sụt lún", "chậm tiến độ"];
        searchAndRespond(plan, riskKeywords, "⚠️ **PHÂN TÍCH RỦI RO & NGUY CƠ TIỀM MẨN:**");
    }

    function answerTotalCost() {
        const plan = savedPlans.find(p => p.id === activePlanId);
        if (!plan || !plan.text) {
            appendMessage('bot', '⚠️ Vui lòng nạp tài liệu để tính toán chi phí.');
            return;
        }
        const text = plan.text;
        const kmMatch = text.match(/(\d+([\.,]\d+)?)\s*(km|cây số)/i);
        const priceMatch = text.match(/(\d+([\.,]\d+)?)\s*(tỷ|triệu)\s*(VND|đồng)?\s*\/\s*km/i) || text.match(/mỗi\s*1\s*km\s*.*?\s*(\d+([\.,]\d+)?)\s*(tỷ|triệu)/i);

        let calculatedResult = "";
        if (kmMatch && priceMatch) {
            const distance = parseFloat(kmMatch[1].replace(',', '.'));
            const unitPrice = parseFloat(priceMatch[1].replace(',', '.'));
            const unitType = priceMatch[0].includes('triệu') ? 'triệu' : 'tỷ';
            const total = distance * unitPrice;
            
            calculatedResult = `🧮 **KẾT QUẢ TỰ ĐỘNG TÍNH TOÁN TỪ FILE:**\n` +
                               `• **Quãng đường:** ${distance} km\n` +
                               `• **Đơn giá 1km:** ${unitPrice} ${unitType} VND/km\n` +
                               `👉 **TỔNG CHI PHÍ THI CÔNG:** **${total.toLocaleString('vi-VN')} ${unitType} VND**\n\n`;
        }

        const costKeywords = ["chi phí", "tổng vốn", "vốn đầu tư", "kinh phí", "chi", "vnd", "usd", "tỷ", "triệu", "đơn giá"];
        const sentences = plan.text.split(/(?<=[.?!;\n])\s+/).map(s => s.trim());
        const matched = sentences.filter(s => costKeywords.some(kw => s.toLowerCase().includes(kw)) && s.length > 10);
        const uniqueResults = [...new Set(matched)].slice(0, 8);

        if (calculatedResult !== "") {
            appendMessage('bot', calculatedResult + `📌 **DỮ LIỆU GỐC TRONG TÀI LIỆU:**\n• ` + uniqueResults.join("\n• "));
        } else if (uniqueResults.length > 0) {
            appendMessage('bot', `💰 **THÔNG TIN CHI PHÍ TRONG (${plan.name}):**\n\n• ` + uniqueResults.join("\n\n• "));
        } else {
            appendMessage('bot', `💰 Không tìm thấy số liệu chi phí cụ thể trong file này.`);
        }
    }

    function searchAndRespond(plan, keywords, title) {
        const sentences = plan.text.split(/(?<=[.?!;\n])\s+/).map(s => s.trim());
        const matched = sentences.filter(s => keywords.some(kw => s.toLowerCase().includes(kw)) && s.length > 10);
        const uniqueResults = [...new Set(matched)].slice(0, 10);

        if (uniqueResults.length > 0) {
            appendMessage('bot', `${title} (${plan.name}):\n\n• ` + uniqueResults.join("\n\n• "));
        } else {
            appendMessage('bot', `${title} Không tìm thấy thông tin phù hợp trong ${plan.name}.`);
        }
    }

    function generateDynamicQuestions() {
        const plan = savedPlans.find(p => p.id === activePlanId);
        if (!plan || !plan.text) {
            appendMessage('bot', '⚠️ Vui lòng nạp tài liệu trước để AI tạo câu hỏi!');
            return;
        }

        appendMessage('user', '🤖 Hãy đặt câu hỏi tổng hợp dựa trên file này');

        setTimeout(() => {
            let questions = [
                "• **Về Lợi Ích Tổng Hợp:** Những giá trị cốt lõi về kinh tế, môi trường sinh thái và phúc lợi an sinh xã hội mà dự án mang lại là gì?",
                "• **Về Rủi Ro & Nguy Cơ:** Đâu là những điểm yếu kỹ thuật hoặc nguy cơ thời tiết, thị trường lớn nhất có thể cản trở dự án?",
                "• **Về Chi Phí & Đầu Tư:** Chi phí đầu tư và đơn giá thực hiện dự án này được cân đối ra sao?"
            ];
            appendMessage('bot', `🤖 **CÁC CÂU HỎI TRỌNG TÂM ĐƯỢC TỔNG HỢP CHO (${plan.name}):**\n\n` + questions.join("\n\n"));
        }, 50);
    }

    function answerProjectModel() {
        const plan = savedPlans.find(p => p.id === activePlanId);
        if (plan && plan.image) {
            appendMessage('bot', `🖼️ **MÔ HÌNH CỦA ${plan.name.toUpperCase()}:**`, plan.image);
            return;
        }
        const defaultImg = projectImages[0];
        appendMessage('bot', `🖼️ **${defaultImg.title}:**\n\nSơ đồ trực quan thể hiện cấu trúc vận hành dự án.`, defaultImg.url);
    }

    function readDocxFileWithTables(f) {
        return new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = e => {
                mammoth.convertToHtml({ arrayBuffer: e.target.result })
                    .then(result => {
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(result.value, 'text/html');
                        let fullText = "";
                        doc.querySelectorAll('h1, h2, h3, h4, p, li, td, th').forEach(el => {
                            const txt = el.textContent.trim();
                            if (txt) fullText += (el.tagName.match(/^H/) ? "\n\n📌 " + txt + "\n" : txt + " ");
                        });
                        res(fullText);
                    })
                    .catch(err => rej(err));
            };
            r.readAsArrayBuffer(f);
        });
    }

    function readPdfFile(f) { 
        return new Promise((res, rej) => { 
            const r = new FileReader(); 
            r.onload = async e => { 
                try { 
                    const pdf = await pdfjsLib.getDocument(new Uint8Array(e.target.result)).promise; 
                    let t = ""; 
                    for(let i = 1; i <= Math.min(pdf.numPages, 15); i++){ 
                        const p = await pdf.getPage(i); 
                        const txt = await p.getTextContent(); 
                        t += txt.items.map(i => i.str).join(" ") + "\n"; 
                    } 
                    res(t); 
                } catch(err){ rej(err); } 
            }; 
            r.readAsArrayBuffer(f); 
        }); 
    }

    function generateDetailedSummary(text) {
        const lines = text.split(/\r?\n|\. /).map(x => x.trim()).filter(x => x.length > 10);
        return lines.length === 0 ? text.slice(0, 500) + "..." : "• " + lines.slice(0, 15).join("\n• ");
    }

    function savePlansToStorage() {
        try {
            const plansToSave = savedPlans.map(p => ({ ...p, image: null }));
            localStorage.setItem("nhom4_saved_plans", JSON.stringify(plansToSave));
        } catch(e) {}
    }

    function clearAllData() {
        localStorage.removeItem("nhom4_saved_plans");
        savedPlans = [];
        activePlanId = null;
        renderPlanChips();
        appendMessage('bot', '🗑️ Đã xóa sạch dữ liệu cũ trong bộ nhớ.');
    }

    function sendQuickQuery(text) {
        document.getElementById('userInput').value = text;
        sendMessage();
    }

    function sendMessage() {
        const input = document.getElementById('userInput');
        const q = input.value.trim();
        if (!q) return;
        appendMessage('user', q);
        input.value = "";
        setTimeout(() => processQuery(q), 50);
    }

    function handleKeyPress(e) { if (e.key === 'Enter') sendMessage(); }
    function escapeHtml(text) { return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

    function appendMessage(sender, text, img = null) {
        const box = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = `message ${sender === 'user' ? 'user-message' : 'bot-message'}`;
        let html = escapeHtml(text).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
        if (img) html += `<br><img src="${img}" class="chat-img" alt="Hình ảnh">`;
        div.innerHTML = html;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    function processQuery(q) {
        const qLower = q.toLowerCase();

        if (qLower.includes("lợi ích") || qLower.includes("tổng hợp lợi ích")) {
            answerAllBenefits();
            return;
        }
        if (qLower.includes("rủi ro") || qLower.includes("nguy cơ") || qLower.includes("thách thức")) {
            answerRisks();
            return;
        }
        if (qLower.includes("chi phí") || qLower.includes("vốn") || qLower.includes("tính")) {
            answerTotalCost();
            return;
        }
        if (qLower.includes("mô hình")) {
            answerProjectModel();
            return;
        }

        const plan = savedPlans.find(p => p.id === activePlanId);
        if (qLower.includes("tóm tắt")) { 
            appendMessage('bot', plan ? `📌 **TÓM TẮT CHI TIẾT:**\n${plan.summary}` : '📌 Trợ lý Nhóm 4 đã sẵn sàng.'); 
            return; 
        }

        if (plan && plan.text) {
            const matches = plan.text.split(/\r?\n|\./).map(l => l.trim()).filter(l => l.toLowerCase().includes(qLower));
            if (matches.length > 0) {
                appendMessage('bot', `🔍 **Kết quả tìm thấy về "${q}" trong ${plan.name}:**\n\n• ` + matches.slice(0, 6).join("\n• "));
                return;
            }
        }

        appendMessage('bot', `Tui chưa tìm thấy thông tin cho "${q}". Bạn có thể chọn các nút **📈 Lợi Ích Tổng Hợp** hoặc **⚠️ Rủi Ro & Nguy Cơ** phía trên nhé!`);
    }
</script>
